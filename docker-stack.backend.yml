services:
  api:
    image: ${BACKEND_IMAGE}
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-gpt-5.6-luna}
      OPENAI_CRM_ANALYSIS_MODEL: ${OPENAI_CRM_ANALYSIS_MODEL:-gpt-5.6-luna}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      ELEVENLABS_TTS_ENABLED: ${ELEVENLABS_TTS_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      TOOL_MEDIA_ALLOWED_HOSTS: ${TOOL_MEDIA_ALLOWED_HOSTS:-}
      VISAGISM_TOOL_ENABLED: ${VISAGISM_TOOL_ENABLED:-false}
      VISAGISM_INTERNAL_RUNTIME_ENABLED: ${VISAGISM_INTERNAL_RUNTIME_ENABLED:-true}
      VISAGISM_ANALYSIS_WORKER_MODEL: ${VISAGISM_ANALYSIS_WORKER_MODEL:-gemini-3.1-flash-lite}
      VISAGISM_MATCHING_WORKER_MODEL: ${VISAGISM_MATCHING_WORKER_MODEL:-gemini-3.1-flash-lite}
      VISAGISM_IMAGE_WORKER_MODEL: ${VISAGISM_IMAGE_WORKER_MODEL:-gpt-image-1}
      PRESCRIPTION_WORKER_ENABLED: ${PRESCRIPTION_WORKER_ENABLED:-true}
      PRESCRIPTION_WORKER_MODEL: ${PRESCRIPTION_WORKER_MODEL:-gemini-3.1-flash-lite}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      STORE_LOCATOR_ENABLED: ${STORE_LOCATOR_ENABLED:-false}
      STORE_LOCATOR_ROUTE_CACHE_MINUTES: ${STORE_LOCATOR_ROUTE_CACHE_MINUTES:-30}
      REDIS_URL: ${REDIS_URL_FOR_CONTAINER}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      GUPSHUP_WEBHOOK_SECRET: ${GUPSHUP_WEBHOOK_SECRET}
      META_PROVIDER_MODE: ${META_PROVIDER_MODE}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_WEBHOOK_APP_SECRET: ${META_WEBHOOK_APP_SECRET}
      META_WEBHOOK_APP_SECRET_REF: ${META_WEBHOOK_APP_SECRET_REF}
      META_TEMPLATES_FIXTURE_PATH: ${META_TEMPLATES_FIXTURE_PATH}
      META_WHATSAPP_OUTBOUND_ENABLED: ${META_WHATSAPP_OUTBOUND_ENABLED:-false}
      META_WHATSAPP_WEBHOOK_WORKER_ENABLED: ${META_WHATSAPP_WEBHOOK_WORKER_ENABLED:-false}
      META_WHATSAPP_TEMPLATE_SYNC_ENABLED: ${META_WHATSAPP_TEMPLATE_SYNC_ENABLED:-false}
      META_WHATSAPP_AUTOMATION_ENABLED: ${META_WHATSAPP_AUTOMATION_ENABLED:-false}
      WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL}
      CRM_BACKEND_PUBLIC_URL: ${CRM_BACKEND_PUBLIC_URL}
      CRM_FRONTEND_PUBLIC_URL: ${CRM_FRONTEND_PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY_VERSION: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY_VERSION:-v1}
      INSTAGRAM_CHANNEL_ENABLED: ${INSTAGRAM_CHANNEL_ENABLED:-false}
      INSTAGRAM_OUTBOUND_ENABLED: ${INSTAGRAM_OUTBOUND_ENABLED:-false}
      INSTAGRAM_WEBHOOK_WORKER_ENABLED: ${INSTAGRAM_WEBHOOK_WORKER_ENABLED:-false}
      INSTAGRAM_WEBHOOK_WORKER_POLL_MS: ${INSTAGRAM_WEBHOOK_WORKER_POLL_MS:-1000}
      INSTAGRAM_WEBHOOK_WORKER_BATCH_SIZE: ${INSTAGRAM_WEBHOOK_WORKER_BATCH_SIZE:-10}
      INSTAGRAM_TOKEN_REFRESH_WORKER_ENABLED: ${INSTAGRAM_TOKEN_REFRESH_WORKER_ENABLED:-false}
      INSTAGRAM_TOKEN_REFRESH_WORKER_POLL_MS: ${INSTAGRAM_TOKEN_REFRESH_WORKER_POLL_MS:-60000}
      INSTAGRAM_TOKEN_REFRESH_WORKER_BATCH_SIZE: ${INSTAGRAM_TOKEN_REFRESH_WORKER_BATCH_SIZE:-5}
      INSTAGRAM_CONVERSATION_WINDOW_HOURS: ${INSTAGRAM_CONVERSATION_WINDOW_HOURS:-24}
      INSTAGRAM_AUTOMATION_ENABLED: ${INSTAGRAM_AUTOMATION_ENABLED:-false}
      INSTAGRAM_PRODUCTION_ROLLOUT_AUTHORIZED: ${INSTAGRAM_PRODUCTION_ROLLOUT_AUTHORIZED:-false}
      PORT: ${API_PORT}
      NODE_ENV: production
      AUTOMATION_WORKER_ENABLED: ${AUTOMATION_WORKER_ENABLED}
      AUTOMATION_WORKER_POLL_MS: ${AUTOMATION_WORKER_POLL_MS}
      AUTOMATION_WORKER_BATCH_SIZE: ${AUTOMATION_WORKER_BATCH_SIZE}
      RB_BILLING_WORKER_ENABLED: ${RB_BILLING_WORKER_ENABLED:-false}
      RB_BILLING_WORKER_POLL_MS: ${RB_BILLING_WORKER_POLL_MS:-60000}
      RB_WEBHOOK_JWT_SECRET: ${RB_WEBHOOK_JWT_SECRET}
      RB_API_BASE_URL: ${RB_API_BASE_URL:-https://app.registrobase.com.br:32077}
      COLLECTION_SECRETS_ENCRYPTION_KEY: ${COLLECTION_SECRETS_ENCRYPTION_KEY}
      COLLECTION_SECRETS_ENCRYPTION_KEY_VERSION: ${COLLECTION_SECRETS_ENCRYPTION_KEY_VERSION:-v1}
      AGENDA_SECRETS_ENCRYPTION_KEY: ${AGENDA_SECRETS_ENCRYPTION_KEY}
      AGENDA_SECRETS_ENCRYPTION_KEY_VERSION: ${AGENDA_SECRETS_ENCRYPTION_KEY_VERSION:-v1}
      AGENDA_INBOUND_RATE_LIMIT_PER_MINUTE: ${AGENDA_INBOUND_RATE_LIMIT_PER_MINUTE:-120}
      VISAGISM_CATALOG_ANALYSIS_MODEL: ${VISAGISM_CATALOG_ANALYSIS_MODEL:-gemini-3.1-flash-lite}
      VISAGISM_CATALOG_MAX_SOURCE_BYTES: ${VISAGISM_CATALOG_MAX_SOURCE_BYTES:-10485760}
      VISAGISM_CATALOG_MAX_STORED_BYTES: ${VISAGISM_CATALOG_MAX_STORED_BYTES:-1500000}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      BI_PROJECTION_WORKER_ENABLED: ${BI_PROJECTION_WORKER_ENABLED:-false}
      BI_PROJECTION_BATCH_SIZE: ${BI_PROJECTION_BATCH_SIZE:-100}
      CALENDAR_FOLLOWUP_ENABLED: ${CALENDAR_FOLLOWUP_ENABLED:-false}
      CALENDAR_FOLLOWUP_DRY_RUN: ${CALENDAR_FOLLOWUP_DRY_RUN:-false}
      CALENDAR_FOLLOWUP_BATCH_SIZE: ${CALENDAR_FOLLOWUP_BATCH_SIZE:-25}
      CALENDAR_FOLLOWUP_1H_TEMPLATE: '${CALENDAR_FOLLOWUP_1H_TEMPLATE:-Ola, {nome}! Passando para lembrar do compromisso "{titulo}" hoje as {horario}.}'
    networks:
      - traefik-public
      - evolution-internal
    deploy:
      replicas: ${BACKEND_REPLICAS}
      placement:
        constraints:
          - node.hostname == ${SWARM_NODE_HOSTNAME}
      restart_policy:
        condition: any
      update_config:
        order: ${BACKEND_UPDATE_ORDER:-start-first}
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK}"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.rule=Host(`${API_DOMAIN}`)"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.entrypoints=${TRAEFIK_ENTRYPOINTS}"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.tls=true"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.service=${TRAEFIK_SERVICE_NAME}"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-rb.rule=Host(`${RB_WEBHOOK_DOMAIN:-hook.rbline.com.br}`) && (Path(`/webhook/login`) || Path(`/webhook/image`) || Path(`/webhook/delete`))"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-rb.entrypoints=${TRAEFIK_ENTRYPOINTS}"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-rb.tls=true"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-rb.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-rb.priority=100"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-rb.service=${TRAEFIK_SERVICE_NAME}"
        - "traefik.http.services.${TRAEFIK_SERVICE_NAME}.loadbalancer.server.port=${API_PORT}"
        - "traefik.http.services.${TRAEFIK_SERVICE_NAME}.loadbalancer.passhostheader=true"

  collection-worker:
    image: ${BACKEND_IMAGE}
    command: ["node", "dist/collection-worker-entry.js"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      COLLECTION_SECRETS_ENCRYPTION_KEY: ${COLLECTION_SECRETS_ENCRYPTION_KEY}
      COLLECTION_SECRETS_ENCRYPTION_KEY_VERSION: ${COLLECTION_SECRETS_ENCRYPTION_KEY_VERSION:-v1}
      COLLECTION_WORKER_POLL_MS: ${COLLECTION_WORKER_POLL_MS:-5000}
      COLLECTION_WORKER_BATCH_SIZE: ${COLLECTION_WORKER_BATCH_SIZE:-50}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - traefik-public
      - evolution-internal
    deploy:
      replicas: ${COLLECTION_WORKER_REPLICAS:-1}
      placement:
        constraints:
          - node.hostname == ${SWARM_NODE_HOSTNAME}
      restart_policy:
        condition: any
      update_config:
        order: stop-first
        failure_action: rollback

  agenda-worker:
    image: ${BACKEND_IMAGE}
    command: ["node", "dist/agenda-worker-entry.js"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AGENDA_SECRETS_ENCRYPTION_KEY: ${AGENDA_SECRETS_ENCRYPTION_KEY}
      AGENDA_SECRETS_ENCRYPTION_KEY_VERSION: ${AGENDA_SECRETS_ENCRYPTION_KEY_VERSION:-v1}
      AGENDA_WORKER_POLL_MS: ${AGENDA_WORKER_POLL_MS:-2000}
      AGENDA_WORKER_BATCH_SIZE: ${AGENDA_WORKER_BATCH_SIZE:-20}
      AGENDA_WORKER_LEASE_SECONDS: ${AGENDA_WORKER_LEASE_SECONDS:-60}
      AGENDA_WORKER_HTTP_TIMEOUT_MS: ${AGENDA_WORKER_HTTP_TIMEOUT_MS:-10000}
      AGENDA_WORKER_MAX_RESPONSE_BYTES: ${AGENDA_WORKER_MAX_RESPONSE_BYTES:-65536}
      AGENDA_RESYNC_WORKER_POLL_MS: ${AGENDA_RESYNC_WORKER_POLL_MS:-2000}
      AGENDA_RESYNC_WORKER_BATCH_SIZE: ${AGENDA_RESYNC_WORKER_BATCH_SIZE:-100}
      AGENDA_RESYNC_WORKER_LEASE_SECONDS: ${AGENDA_RESYNC_WORKER_LEASE_SECONDS:-60}
      AGENDA_INBOUND_RATE_LIMIT_PER_MINUTE: ${AGENDA_INBOUND_RATE_LIMIT_PER_MINUTE:-120}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - traefik-public
      - evolution-internal
    deploy:
      replicas: ${AGENDA_WORKER_REPLICAS:-1}
      placement:
        constraints:
          - node.hostname == ${SWARM_NODE_HOSTNAME}
      restart_policy:
        condition: any
      update_config:
        order: stop-first
        failure_action: rollback

  media-cleanup-worker:
    image: ${BACKEND_IMAGE}
    command: ["node", "dist/media-cleanup-worker-entry.js"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MEDIA_CLEANUP_WORKER_POLL_MS: ${MEDIA_CLEANUP_WORKER_POLL_MS:-86400000}
      MEDIA_CLEANUP_WORKER_BATCH_SIZE: ${MEDIA_CLEANUP_WORKER_BATCH_SIZE:-100}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - traefik-public
      - evolution-internal
    deploy:
      replicas: ${MEDIA_CLEANUP_WORKER_REPLICAS:-1}
      placement:
        constraints:
          - node.hostname == ${SWARM_NODE_HOSTNAME}
      restart_policy:
        condition: any
      update_config:
        order: stop-first
        failure_action: rollback

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK}
  evolution-internal:
    external: true
    name: ${EVOLUTION_NETWORK}
