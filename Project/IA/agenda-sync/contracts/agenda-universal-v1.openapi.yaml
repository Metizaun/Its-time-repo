openapi: 3.1.0
info:
  title: Its Time Agenda Universal
  version: 1.0.0
  description: |
    Contrato público e independente de parceiro para sincronização de agenda.

    A integração é bidirecional e baseada em webhooks. O Its Time é a autoridade
    para agendamentos, unidades, profissionais, disponibilidade e pacientes. O
    parceiro recebe esses eventos e reporta somente o resultado final do
    atendimento por meio de `appointment.status_reported`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Its Time Developer Relations
    url: https://itstime.pro/dev/documentacao/agenda
servers:
  - url: https://api.itstime.pro
    description: Produção
security:
  - agendaTimestamp: []
    agendaSignature: []
    idempotencyKey: []
paths:
  /api/integrations/agenda/v1/connections/{publicConnectionId}/events:
    post:
      operationId: reportAgendaAppointmentStatus
      summary: Reporta o resultado de um atendimento
      description: |
        Aceita `appointment.status_reported`. Eventos desconhecidos são registrados
        para idempotência e ignorados com HTTP 200.

        Assine o corpo com o `inboundSecret` da conexão. O `Idempotency-Key` deve
        ser byte a byte igual ao `eventId` do JSON.
      parameters:
        - name: publicConnectionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{48}$"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgendaTimestamp"
        - $ref: "#/components/parameters/AgendaSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./agenda-universal-v1.schema.json#/$defs/InboundRequest"
            examples:
              appointmentStatusReported:
                summary: Atendimento concluído
                value:
                  schemaVersion: "1.0"
                  eventId: 4b1d2d8a-5bd2-4f4c-9a9e-26a9a0e2d001
                  eventType: appointment.status_reported
                  occurredAt: "2026-09-15T18:00:00Z"
                  resource:
                    appointmentId: 6f0f3d0f-9db5-4f35-a6e8-0a0c4d0e1001
                    status: done
                    reason: null
                    reportedAt: "2026-09-15T18:00:00Z"
                    baseResourceVersion: 7
                    metadata:
                      source: reception
      responses:
        "200":
          description: Evento desconhecido ignorado ou recibo já concluído.
          content:
            application/json:
              schema:
                $ref: "./agenda-universal-v1.schema.json#/$defs/Receipt"
              example:
                accepted: false
                duplicate: false
                ignored: true
                eventId: 4b1d2d8a-5bd2-4f4c-9a9e-26a9a0e2d001
        "202":
          description: Evento aceito ou duplicado de processamento idempotente.
          content:
            application/json:
              schema:
                $ref: "./agenda-universal-v1.schema.json#/$defs/Receipt"
              examples:
                accepted:
                  value:
                    accepted: true
                    duplicate: false
                    eventId: 4b1d2d8a-5bd2-4f4c-9a9e-26a9a0e2d001
                    resourceVersion: 8
                duplicate:
                  value:
                    accepted: true
                    duplicate: true
                    eventId: 4b1d2d8a-5bd2-4f4c-9a9e-26a9a0e2d001
                    resourceVersion: 8
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
webhooks:
  agendaEvent:
    post:
      operationId: receiveAgendaEvent
      summary: Recebe um evento da Agenda Universal
      description: |
        A URL é configurada por conexão. O consumidor deve ignorar `eventType`
        e campos desconhecidos. `publicConnectionId` identifica a conexão de origem
        e pode ser mapeado para a base do grupo; vários IDs podem apontar para a
        mesma base. `Idempotency-Key` é idêntico a `eventId`.

        Na ativação inicial ou em uma ressincronização, cada recurso é enviado
        em uma requisição separada, nesta ordem: unidade, profissional,
        disponibilidade, paciente, agendamento. Depois são entregues as mudanças
        capturadas durante o snapshot. Os exemplos `resync*` mostram os envelopes
        individuais desse snapshot.

        Verifique a assinatura com o `outboundSecret` da conexão e responda
        rapidamente com qualquer status 2xx depois de persistir o evento.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgendaTimestamp"
        - $ref: "#/components/parameters/AgendaSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./agenda-universal-v1.schema.json#/$defs/OutboundEnvelope"
            examples:
              integrationTest:
                summary: Teste de conexão
                value:
                  schemaVersion: "1.0"
                  publicConnectionId: 4f5a39c0d310a4b91f8de2c770a1b2c3d4e5f60718293a4b
                  eventId: 88888888-8888-4888-8888-888888888888
                  eventType: integration.test
                  occurredAt: "2026-09-25T12:00:00.000Z"
                  resource:
                    message: Its Time Agenda Universal connection test
              appointmentCreated:
                summary: Novo agendamento
